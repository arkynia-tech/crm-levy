# Builda o app e publica, numa árvore só, o que a Hostinger serve:
#
#   public_html/          ← landing (contatta.pro)
#   public_html/app/      ← CRM     (app.contatta.pro, cujo docroot é esta pasta)
#
# Vai tudo junto porque o plano da Hostinger só permite UMA implantação de Git
# por site. Por isso o diretório raiz da implantação tem que estar EM BRANCO
# (public_html), e não mais "app".
name: Build para Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'n8n/**'
      - 'supabase/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_N8N_NFE_WEBHOOK_URL: ${{ secrets.VITE_N8N_NFE_WEBHOOK_URL }}
          VITE_N8N_WA_CAMPAIGN_URL: ${{ secrets.VITE_N8N_WA_CAMPAIGN_URL }}
          VITE_N8N_VARIAR_URL: ${{ secrets.VITE_N8N_VARIAR_URL }}
          VITE_N8N_ENRICH_URL: ${{ secrets.VITE_N8N_ENRICH_URL }}
          VITE_N8N_ADMIN_USERS_URL: ${{ secrets.VITE_N8N_ADMIN_USERS_URL }}
          VITE_N8N_WA_INSTANCE_URL: ${{ secrets.VITE_N8N_WA_INSTANCE_URL }}

      - name: Montar a árvore do domínio
        run: |
          rm -rf site
          mkdir -p site/app
          cp -r landing/. site/
          cp -r dist/. site/app/
          echo "--- o que vai para a Hostinger ---"
          find site -maxdepth 2 | sort

      - name: Publicar na branch hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./site
          force_orphan: true
          commit_message: 'Build de ${{ github.sha }}'
