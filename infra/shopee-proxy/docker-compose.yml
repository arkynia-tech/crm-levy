# Repasse da Shopee na VPS arkynia.prod (31.97.26.181, Docker + Traefik).
# Quem sobe é o script subir.sh (no Mac): ele lê no n8n-dev a rede, o
# entrypoint e o resolvedor de certificado do Traefik e grava tudo no .env da
# pasta na VPS (/opt/shopee-proxy), junto com PROXY_CHAVE (a mesma de
# SHOPEE_PROXY_CHAVE no Supabase).
services:
  shopee-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      PROXY_CHAVE: ${PROXY_CHAVE:?defina PROXY_CHAVE}
    volumes:
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.shopee-proxy.rule=Host(`shopee-proxy.arkynia.com.br`)
      - traefik.http.routers.shopee-proxy.entrypoints=${ENTRYPOINT:-websecure}
      - traefik.http.routers.shopee-proxy.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.shopee-proxy.loadbalancer.server.port=80

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
