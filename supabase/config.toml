# Só o que o `supabase functions deploy` precisa ler. O banco não é gerido pela
# CLI: os .sql desta pasta são rodados à mão no SQL Editor.
project_id = "lopdvdblwasuowjdokpo"

# Nenhuma das funções de cobrança usa a checagem de JWT do Supabase:
# - asaas-assinaturas confere o login por dentro (auth.getUser), como o n8n fazia;
# - asaas-checkout é o formulário público do site;
# - asaas-webhook é chamado pelo Asaas e o banco confere o asaas-access-token;
# - asaas-cobranca-diaria é chamado pelo pg_cron com o token do cron.
[functions.asaas-assinaturas]
verify_jwt = false

[functions.asaas-checkout]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false

[functions.asaas-cobranca-diaria]
verify_jwt = false

# Integração com o Bling, também sem a checagem de JWT do gateway:
# - bling-conexao confere o login por dentro (auth.getUser);
# - bling-renovacao é chamado pelo pg_cron com o token do cron.
[functions.bling-conexao]
verify_jwt = false

[functions.bling-renovacao]
verify_jwt = false

# Fase 2 do Bling:
# - bling-webhook é chamado pelo Bling e confere a assinatura X-Bling-Signature-256;
# - bling-pedidos é chamado pelo pg_cron com o token do cron.
[functions.bling-webhook]
verify_jwt = false

[functions.bling-pedidos]
verify_jwt = false

# Novidades: novidades-aviso confere o login (master) por dentro e o pg_cron
# chama com o token do cron.
[functions.novidades-aviso]
verify_jwt = false

# Agendador de disparos: chamado pelo pg_cron com o token do cron (x-cron-token).
[functions.campanhas-agendadas]
verify_jwt = false

# Nuvemshop, também sem a checagem de JWT do gateway:
# - nuvemshop-conexao confere o login por dentro (auth.getUser);
# - nuvemshop-webhook é chamado pela Nuvemshop e confere o x-linkedstore-hmac-sha256;
# - nuvemshop-pedidos é chamado pelo pg_cron com o token do cron.
[functions.nuvemshop-conexao]
verify_jwt = false

[functions.nuvemshop-webhook]
verify_jwt = false

[functions.nuvemshop-pedidos]
verify_jwt = false

# Shopify, sem a checagem de JWT do gateway:
# - shopify-conexao confere o login por dentro (auth.getUser);
# - shopify-webhook é chamado pela Shopify e confere o X-Shopify-Hmac-SHA256;
# - shopify-pedidos é chamado pelo pg_cron com o token do cron.
[functions.shopify-conexao]
verify_jwt = false

[functions.shopify-webhook]
verify_jwt = false

[functions.shopify-pedidos]
verify_jwt = false

# TikTok Shop, também sem a checagem de JWT do gateway:
# - tiktok-conexao confere o login por dentro (auth.getUser);
# - tiktok-webhook é chamado pelo TikTok e confere o cabeçalho Authorization (HMAC);
# - tiktok-pedidos é chamado pelo pg_cron com o token do cron.
[functions.tiktok-conexao]
verify_jwt = false

[functions.tiktok-webhook]
verify_jwt = false

[functions.tiktok-pedidos]
verify_jwt = false

# Mercado Livre, também sem a checagem de JWT do gateway:
# - mercadolivre-conexao confere o login por dentro (auth.getUser);
# - mercadolivre-webhook é chamado pelo Mercado Livre (sem assinatura: confere o
#   application_id e relê o pedido na API) e pelo cron de aquecimento (GET);
# - mercadolivre-pedidos é chamado pelo pg_cron com o token do cron.
[functions.mercadolivre-conexao]
verify_jwt = false

[functions.mercadolivre-webhook]
verify_jwt = false

[functions.mercadolivre-pedidos]
verify_jwt = false

# Enriquecimento automático: chamado só pelo pg_cron, com o token do cron.
[functions.enriquecimento-auto]
verify_jwt = false
